<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>부품 사양 찾기</title>
<meta name="theme-color" content="#F4F5F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="부품사양">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>
  // 화면을 그리기 전에 테마 먼저 적용 (깜빡임 방지)
  try { if (localStorage.getItem('ep.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
</script>
<style>
:root{
  --bg:#F4F5F9; --card:#FFFFFF; --line:#E4E6EE; --text:#16182B; --sub:#5D6177; --mute:#9A9DB2;
  --accent:#2F6FEB; --accent-weak:#E8F0FF; --amber:#F2A516; --amber-weak:#FFF4DC;
  --ok:#1F9D57; --warn:#D9534F; --warn-weak:#FDECEC; --shadow:0 1px 2px rgba(20,22,40,.04),0 4px 14px rgba(20,22,40,.05);
  --chip:#EEF0F6; --tab:rgba(255,255,255,.92);
}
[data-theme="dark"]{
  --bg:#15142A; --card:#1E1D38; --line:#2E2D4D; --text:#FFFFFF; --sub:#B8B6D3; --mute:#8F8DB3;
  --accent:#8CCBF5; --accent-weak:#24304D; --amber:#FFC56E; --amber-weak:#3A3122;
  --ok:#5FD39A; --warn:#FF8A80; --warn-weak:#3A2230; --shadow:none; --chip:#28274A; --tab:rgba(21,20,42,.92);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
header.top{display:flex;align-items:center;gap:10px;margin:4px 2px 16px}
header.top h1{font-size:22px;margin:0;letter-spacing:-.3px}
header.top .back{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
header.top .sp{flex:1}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--sub)} .small{font-size:13px} .tiny{font-size:12px;color:var(--mute)}
.scan{background:linear-gradient(0deg,var(--card),var(--card));border:1.5px solid var(--line)}
.scan .lead{font-size:20px;font-weight:700;margin:2px 0 4px;letter-spacing:-.3px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;background:var(--chip);font-weight:600}
.btn.primary{background:var(--accent);color:#fff}
[data-theme="dark"] .btn.primary{color:#15142A}
.btn.sm{height:38px;flex:0 0 auto;padding:0 14px;border-radius:11px;font-size:14px}
.btn svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 13px;border-radius:999px;background:var(--chip);font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff;font-weight:600}
[data-theme="dark"] .chip.on{color:#15142A}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.part{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:8px;min-height:112px}
.part .ic{width:40px;height:40px;border-radius:12px;background:var(--amber-weak);display:grid;place-items:center;color:var(--amber)}
.part .ic svg{width:24px;height:24px}
.part b{font-size:16px} .part span{font-size:12.5px;color:var(--sub)}
.sec-title{font-size:13px;font-weight:700;color:var(--sub);margin:20px 4px 8px;letter-spacing:.2px}
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.inp{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;outline:none;font-size:16px}
.inp:focus{border-color:var(--accent)}
.inp.big{height:54px;font-size:20px;font-weight:600;letter-spacing:.5px}
.unit{position:relative} .unit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mute);font-size:14px;pointer-events:none}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.res-big{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.res-big small{font-size:18px;font-weight:600;color:var(--sub);margin-left:6px}
.rows{margin-top:10px;border-top:1px solid var(--line)}
.row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .k{flex:0 0 96px;font-size:13px;color:var(--sub);padding-top:1px}
.row .v{flex:1;font-size:14.5px;font-weight:500;word-break:keep-all}
.note{background:var(--accent-weak);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.note.warn{background:var(--warn-weak);color:var(--warn)}
.note.amber{background:var(--amber-weak)}
.bands{display:flex;flex-direction:column;gap:12px}
.band-l{font-size:13px;color:var(--sub);margin-bottom:6px}
.sw{width:31px;height:31px;border-radius:10px;border:2px solid transparent;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--card) inset,0 0 0 1px rgba(0,0,0,.15)}
.sw.none{background:repeating-linear-gradient(45deg,var(--chip),var(--chip) 4px,var(--line) 4px,var(--line) 8px)}
.swrow{display:flex;flex-wrap:wrap;gap:6px}
.resistor-svg{display:block;width:100%;max-width:360px;margin:4px auto 6px}
.scanbox{display:flex;gap:12px;align-items:flex-start}
.scanbox img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:0 0 auto;background:var(--chip)}
.hist{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.hist:last-child{border-bottom:0}
.hist .th{width:52px;height:52px;border-radius:12px;background:var(--amber-weak);color:var(--amber);display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.hist .th img{width:100%;height:100%;object-fit:cover}
.hist .th svg{width:24px;height:24px}
.hist .tx{flex:1;min-width:0}
.hist .tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .tx span{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .del{width:32px;height:32px;border-radius:10px;color:var(--mute);display:grid;place-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tab);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--mute)}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs svg{width:23px;height:23px}
.overlay{position:fixed;inset:0;background:rgba(10,10,25,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:86vh;overflow:auto}
.sheet h3{margin:2px 0 6px;font-size:18px}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 6px}
.loading img{width:180px;height:180px;object-fit:cover;border-radius:16px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);background:#16182B;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.hide{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre-wrap;word-break:break-all}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap"><div id="view"></div></div>
<nav class="tabs"><div class="in">
  <button data-go="#/" id="tab-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
  <button data-go="#/history" id="tab-history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>기록</button>
  <button data-go="#/settings" id="tab-settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
</div></nav>
<input type="file" id="fileCam" accept="image/*" capture="environment" class="hide">
<input type="file" id="fileLib" accept="image/*" class="hide">
<input type="file" id="fileBackup" accept="application/json,.json" class="hide">
<div class="toast" id="toast"></div>

<script src="calc.js"></script>
<script>
/* ============ 설정 ============ */
// Cloudflare Worker 주소. 배포 후 여기에 넣거나, 앱 설정 화면에서 넣어도 된다.
const DEFAULT_AI_URL = 'https://part-spec-ai.9354gmlemr.workers.dev';
const MAX_HISTORY = 40;

/* ============ 저장소 (키 앞에 ep. 접두어: 같은 github.io 주소의 다른 앱과 겹치지 않게) ============ */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('ep.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ep.' + k, JSON.stringify(v)); return true; } catch (e) { toast('저장 공간이 부족해요. 기록을 조금 지워 주세요'); return false; } },
};
let settings = Object.assign({ aiUrl: DEFAULT_AI_URL, freq: 60 }, LS.get('settings', {}));
if (!settings.aiUrl) settings.aiUrl = DEFAULT_AI_URL;   // 예전에 빈 주소가 저장돼 있어도 기본 서버 사용
let history = LS.get('history', []);

/* ============ 아이콘 ============ */
const IC = {
  resistor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h3l2-5 3 10 3-10 3 10 2-5h4"/></svg>',
  capacitor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12h8M14 12h8M10 5v14M14 5v14"/></svg>',
  inductor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 14h2a3 3 0 0 1 6 0 3 3 0 0 1 6 0 3 3 0 0 1 6 0"/><path d="M4 14h0M20 14h2"/></svg>',
  motor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M8.5 15.5V8.5L12 13l3.5-4.5v7"/></svg>',
  breaker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2"/><rect x="9.5" y="7" width="5" height="6" rx="1"/><path d="M12 7v3"/><path d="M9 17h6"/></svg>',
  wire: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17c4 0 4-10 9-10s5 10 9 10"/><circle cx="3" cy="17" r="1.2"/><circle cx="21" cy="17" r="1.2"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  x: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
};

/* ============ 부품 정의 ============ */
const PARTS = {
  resistor:  { name: '저항',     sub: '색띠 · SMD 코드',     def: () => ({ mode: 'color', n: 4, bands: ['yellow', 'violet', 'red', 'gold'], smd: '103', val: '4.7k' }) },
  capacitor: { name: '콘덴서',   sub: '104 · 2A473J · µF',  def: () => ({ text: '104K 50V', f: settings.freq }) },
  inductor:  { name: '인덕터',   sub: '101 · 4R7 · 색띠',    def: () => ({ mode: 'code', text: '101', n: 4, bands: ['brown', 'black', 'brown', 'gold'], f: 1000 }) },
  motor:     { name: '모터 명판', sub: '출력 · 회전수 · 토크', def: () => ({ phase: 3, voltage: '', current: '', kw: '', hp: '', freq: settings.freq, poles: '', rpm: '', eff: '', pf: '', ins: '', ip: '', duty: '', sf: '', conn: '', sel: null }) },
  breaker:   { name: '차단기',   sub: '정격 · 곡선 · 감도',  def: () => ({ kind: 'MCCB', poles: 3, in: '', af: '', curve: '', ka: '', ma: '', v: '' }) },
  wire:      { name: '전선',     sub: 'HFIX · F-CV · sq',   def: () => ({ text: '', kind: 'HFIX', sq: 2.5, cores: '', sys: '1p2w', L: '', I: '', V: 220 }) },
};

/* ============ 상태 ============ */
let cur = null;          // { part, input, scan }
let scanHint = 'auto';   // 사진 분석 때 AI에게 주는 힌트

/* ============ 도우미 ============ */
const $ = s => document.querySelector(s);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
function rowsHTML(rows) { return rows.length ? `<div class="rows">${rows.map(([k, v]) => `<div class="row"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>` : ''; }
function notesHTML(list, cls = '') { return list.map(n => `<div class="note ${cls}">${esc(n)}</div>`).join(''); }
function chipsHTML(key, opts, val, attr = 'set') { return `<div class="chips">${opts.map(([v, l]) => `<button class="chip ${String(v) === String(val) ? 'on' : ''}" data-${attr}="${esc(key)}" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>`; }
function field(label, key, val, o = {}) {
  return `<label class="f"><span>${esc(label)}</span><div class="unit"><input class="inp ${o.big ? 'big' : ''}" data-k="${esc(key)}" value="${esc(val ?? '')}" placeholder="${esc(o.ph || '')}" ${o.num ? 'inputmode="decimal"' : ''} autocomplete="off" autocapitalize="characters" spellcheck="false">${o.unit ? `<em>${esc(o.unit)}</em>` : ''}</div></label>`;
}
function header(title, back) {
  return `<header class="top">${back ? `<button class="back" data-go="${back}" aria-label="뒤로">${IC.back}</button>` : ''}<h1>${esc(title)}</h1><div class="sp"></div></header>`;
}
function fmtDate(t) { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }

/* ============ 라우팅 ============ */
function route() {
  const h = location.hash || '#/';
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('on'));
  if (h.startsWith('#/part/')) {
    const id = h.slice(7);
    if (!PARTS[id]) { location.hash = '#/'; return; }
    if (!cur || cur.part !== id) cur = { part: id, input: PARTS[id].def(), scan: null };
    renderPart();
  } else if (h === '#/history') { $('#tab-history').classList.add('on'); renderHistory(); }
  else if (h === '#/settings') { $('#tab-settings').classList.add('on'); renderSettings(); }
  else { $('#tab-home').classList.add('on'); renderHome(); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
function openPart(id, input, scan) { cur = { part: id, input: Object.assign(PARTS[id].def(), input || {}), scan: scan || null }; if (location.hash === '#/part/' + id) route(); else location.hash = '#/part/' + id; }

/* ============ 홈 ============ */
function renderHome() {
  const recent = history.slice(0, 3);
  $('#view').innerHTML = `
    ${header('부품 사양 찾기')}
    <div class="card scan">
      <div class="tiny">사진으로 분석</div>
      <div class="lead">부품이나 명판을 찍으면<br>사양을 알려 드려요</div>
      <div class="small muted">저항 색띠, 콘덴서 표기, 모터·차단기 명판, 전선 표기를 읽어요.</div>
      <div class="sec-title" style="margin:14px 0 6px">무엇을 찍나요?</div>
      ${chipsHTML('hint', [['auto', '자동'], ...Object.entries(PARTS).map(([k, p]) => [k, p.name])], scanHint, 'hint')}
      <div class="btnrow">
        <button class="btn primary" data-act="cam">${IC.camera}카메라</button>
        <button class="btn" data-act="lib">${IC.image}앨범</button>
      </div>
      ${settings.aiUrl ? '' : `<div class="note amber">AI 서버가 아직 연결되지 않았어요. <button data-act="demo" style="color:var(--accent);font-weight:600">예시로 체험하기</button> · <a href="#/settings">설정</a></div>`}
    </div>
    <div class="sec-title">직접 입력해서 찾기</div>
    <div class="grid2">
      ${Object.entries(PARTS).map(([k, p]) => `<button class="part" data-go="#/part/${k}" data-new="1"><div class="ic">${IC[k]}</div><b>${p.name}</b><span>${p.sub}</span></button>`).join('')}
    </div>
    ${recent.length ? `<div class="sec-title">최근 기록</div><div class="card" style="padding:4px 16px">${recent.map(histItem).join('')}</div>` : ''}
  `;
}

/* ============ 부품 화면 ============ */
function renderPart() {
  const p = PARTS[cur.part];
  // 사진에서 읽었거나 색띠를 고르는 화면은 결과를 위에 (스크롤 없이 바로 보이게)
  const resultFirst = !!cur.scan || cur.input.mode === 'color';
  $('#view').innerHTML = `
    ${header(p.name, '#/')}
    ${cur.scan ? scanBanner() : ''}
    ${resultFirst ? '<div class="card" id="result"></div>' : ''}

function scanBanner() {

/* ---------- 저항 ---------- */
function resistorSVG(bands) {
  const list = bands.filter(b => b !== 'none');
  const n = list.length, x0 = 92, w = 176;
  const pos = list.map((_, i) => n >= 4 && i === n - 1 ? x0 + w - 30 : x0 + 22 + i * (n >= 5 ? 24 : 30));
  return `<svg class="resistor-svg" viewBox="0 0 360 90" aria-hidden="true">
    <line x1="0" y1="45" x2="360" y2="45" stroke="#A9ADB8" stroke-width="5" stroke-linecap="round"/>
    <rect x="${x0 - 14}" y="18" width="${w + 28}" height="54" rx="27" fill="#E8D3A9"/>
    <rect x="${x0}" y="24" width="${w}" height="42" rx="8" fill="#E8D3A9"/>
    ${list.map((b, i) => `<rect x="${pos[i]}" y="${i === 0 || (n >= 4 && i === n - 1) ? 19 : 24}" width="12" height="${i === 0 || (n >= 4 && i === n - 1) ? 52 : 42}" fill="${CMAP[b]?.hex || '#ccc'}"/>`).join('')}
  </svg>`;
}
const ROLE_NAME = { d: '숫자', m: '배수', t: '오차', tc: '온도계수' };
function bandPicker(input) {
  const roles = bandRoles(input.n);
  return `<div class="bands">${roles.map((r, i) => `
    <div><div class="band-l">${i + 1}번째 띠 · ${ROLE_NAME[r]}${input.bands[i] ? ` · <b>${CMAP[input.bands[i]]?.n || input.bands[i]}</b>` : ''}</div>
    <div class="swrow">${colorsFor(r, i === 0).map(c => `<button class="sw ${c.k === 'none' ? 'none' : ''} ${input.bands[i] === c.k ? 'on' : ''}" style="${c.k === 'none' ? '' : 'background:' + c.hex}" data-band="${i}" data-v="${c.k}" aria-label="${c.n}"></button>`).join('')}</div></div>`).join('')}
  </div>`;
}
function setBandCount(input, n) {
  const d = decodeBands(input.bands);
  input.n = n;
  const v = valueToBands(d.ok && d.ohm > 0 ? d.ohm : 1000, n);
  input.bands = v.ok ? v.bands : valueToBands(1000, n).bands;
  // 오차 띠는 원래 값 유지 (4줄은 4번째, 5·6줄은 5번째 띠)
  const tolColor = d.ok ? COLORS.find(c => c.tol === d.tol && (c.k !== 'none' || n === 4)) : null;
  if (tolColor) input.bands[n === 4 ? 3 : 4] = tolColor.k;
}

      <div class="band-l" style="margin-top:12px">트립 곡선 (MCB에 C16처럼 적힘)</div>${chipsHTML('curve', [['', '없음'], ['B', 'B'], ['C', 'C'], ['D', 'D']], i.curve)}

/* ---------- 결과 ---------- */
const RESULTS = {
  resistor(i) {
    if (i.mode === 'color') {
      const d = decodeBands(i.bands);
      if (!d.ok) return { html: notesHTML([d.err], 'warn') };
      const rows = [
        ['허용 범위', `${fmtSI(d.min, 'Ω')} ~ ${fmtSI(d.max, 'Ω')}`],
        ['읽는 법', readHow(d.bands)],
      ];
      if (d.tc != null) rows.push(['온도 계수', `${d.tc} ppm/°C (1°C 오를 때 ${d.tc / 1e4}% 변함)`]);
      const es = eSeries(d.ohm); rows.push(['표준값', es.length ? es.join(', ') + ' 계열에 있는 값' : '표준 계열(E12·E24·E96)에 없는 값이에요']);
      const notes = [];
      if (cur.scan?.flipped) notes.push('사진에서는 반대쪽부터 읽혀서 순서를 뒤집었어요');
      return {
        title: `저항 ${fmtSI(d.ohm, 'Ω')}`, summary: `${d.bands.map(b => CMAP[b].n).join('-')} · ±${d.tol}%`,
        html: `<div class="tiny">저항값</div><div class="res-big">${fmtSI(d.ohm, 'Ω')}<small>±${d.tol}%</small></div>${rowsHTML(rows)}${notesHTML(notes, 'amber')}
          <div class="btnrow"><button class="btn sm" data-act="flip">반대로 읽기</button></div>`,
      };
    }
    if (i.mode === 'smd') {
      const d = decodeSMD(i.smd);
      if (!d.ok) return { html: notesHTML([d.err], 'warn') };
      const rows = [['코드 종류', d.kind]];
      if (d.tol) rows.push(['오차(보통)', `±${d.tol}%  (${fmtSI(d.ohm * (1 - d.tol / 100), 'Ω')} ~ ${fmtSI(d.ohm * (1 + d.tol / 100), 'Ω')})`]);
      const es = eSeries(d.ohm); if (d.ohm > 0) rows.push(['표준값', es.length ? es.join(', ') + ' 계열' : '표준 계열에 없는 값']);
      return { title: `SMD 저항 ${fmtSI(d.ohm, 'Ω')}`, summary: `코드 ${i.smd}`, html: `<div class="tiny">저항값</div><div class="res-big">${fmtSI(d.ohm, 'Ω')}</div>${rowsHTML(rows)}${notesHTML([d.note])}` };
    }
    const ohm = parseOhm(i.val);
    if (ohm == null) return { html: notesHTML(['값을 읽을 수 없어요. 예) 4.7k, 4k7, 220, 1M'], 'warn') };
    const v = valueToBands(ohm, +i.n);
    if (!v.ok) return { html: notesHTML([v.err], 'warn') };
    return {
      title: `${fmtSI(ohm, 'Ω')} 색띠`, summary: v.bands.map(b => CMAP[b].n).join('-'),
      html: `<div class="tiny">${i.n}줄 색띠</div>${resistorSVG(v.bands)}<div class="res-big" style="font-size:22px">${v.bands.map(b => CMAP[b].n).join(' · ')}</div>
        ${rowsHTML([['읽는 법', readHow(v.bands)]])}
        ${v.exact ? '' : notesHTML([`${i.n}줄로는 정확히 나타낼 수 없어서 ${fmtSI(v.shown, 'Ω')}로 맞췄어요`], 'amber')}
        ${notesHTML([`오차 띠는 ${i.n === 4 ? '금색(±5%)' : '갈색(±1%)'}으로 넣었어요${i.n === 6 ? ', 온도계수 띠는 갈색(100ppm)' : ''}`])}`,
    };
  },
  capacitor(i) {
    const r = parseCap(i.text);
    if (r.pF == null) return { html: notesHTML(['용량 표기를 찾지 못했어요. 예) 104, 104K, 2A473J, 4n7, 470µF 25V'], 'warn') };
    const f = num(i.f);
    const xc = reactanceC(r.pF, f);
    const rows = [['단위 바꾸기', `${trimNum(r.pF)} pF = ${trimNum(r.pF / 1e3)} nF = ${trimNum(r.pF / 1e6)} µF`]];
    if (r.tol) rows.push(['오차', r.tol + (r.tolLetter ? ` (${r.tolLetter})` : '')]);
    if (r.volt) rows.push(['내압', `${trimNum(r.volt)} V${r.vType ? ' ' + r.vType : ''}` + (r.vCode ? ` (코드 ${r.vCode})` : '')]);
    if (r.die) rows.push(['유전체', `${r.die.name}: ${r.die.cls}. ${r.die.text}`]);
    if (xc) rows.push([`리액턴스`, `${fmtSI(xc, 'Ω')} (${trimNum(f)} Hz에서, Xc = 1 ÷ 2πfC)`]);
    const notes = [r.how].filter(Boolean), amber = [];
    if (r.pF >= 1e6 && !r.die && r.vType !== 'AC') amber.push('1µF 이상 전해 콘덴서라면 극성(+/−)이 있어요. 몸통의 띠(−) 쪽과 긴 다리(+)를 확인하세요');
    if (r.vType === 'AC') amber.push('AC 정격 콘덴서예요. 모터 기동·운전용 등 교류 회로에 쓰고, 극성이 없어요');
    if (!r.volt) amber.push('내압 표기가 없어요. 큰 콘덴서는 몸통에, 작은 세라믹은 보통 따로 표시하지 않아요');
    return {
      title: `콘덴서 ${fmtSI(r.pF * 1e-12, 'F')}`, summary: [r.tol, r.volt ? trimNum(r.volt) + 'V' : '', i.text].filter(Boolean).join(' · '),
      html: `<div class="tiny">정전 용량</div><div class="res-big">${fmtSI(r.pF * 1e-12, 'F')}${r.tol ? `<small>${esc(r.tol)}</small>` : ''}</div>${rowsHTML(rows)}${notesHTML(notes)}${notesHTML(amber, 'amber')}`,
    };
  },
  inductor(i) {
    let uH, how, tol = null;
    if (i.mode === 'color') {
      const d = decodeBands(i.bands);
      if (!d.ok) return { html: notesHTML([d.err], 'warn') };
      uH = d.ohm; tol = '±' + d.tol + '%'; how = readHow(d.bands).replace('Ω', 'µH');
    } else {
      const r = parseInd(i.text);
      if (r.uH == null) return { html: notesHTML(['표기를 읽지 못했어요. 예) 101, 4R7, 22uH, 10mH'], 'warn') };
      uH = r.uH; how = r.how; tol = r.tol || null;
    }
    const f = num(i.f), xl = reactanceL(uH, f);
    const rows = [['단위 바꾸기', `${trimNum(uH * 1000)} nH = ${trimNum(uH)} µH = ${trimNum(uH / 1000)} mH`]];
    if (tol) rows.push(['오차', tol]);
    if (xl) rows.push(['리액턴스', `${fmtSI(xl, 'Ω')} (${trimNum(f)} Hz에서, XL = 2πfL)`]);
    if (how) rows.push(['읽는 법', how]);
    return { title: `인덕터 ${fmtSI(uH * 1e-6, 'H')}`, summary: i.mode === 'color' ? '색띠' : '표기 ' + i.text, html: `<div class="tiny">인덕턴스</div><div class="res-big">${fmtSI(uH * 1e-6, 'H')}${tol ? `<small>${tol}</small>` : ''}</div>${rowsHTML(rows)}` };
  },
  motor(i) {
    const m = motorCalc(i);
    if (!m.rows.length) return { html: `<div class="muted small">명판에 적힌 값을 위에 넣어 주세요. 출력과 회전수만 있어도 토크를 계산해요.</div>` };
    const sel = m.volts.length > 1 ? `<div class="band-l" style="margin-top:4px">어느 전압으로 쓰나요?</div>${chipsHTML('sel', m.volts.map((v, j) => [j, v + 'V']), m.sel, 'sel')}` : '';
    const big = m.P ? `${trimNum(m.P)} kW` : m.T ? `${trimNum(m.T, 3)} N·m` : '';
    return {
      title: `모터 ${m.P ? trimNum(m.P) + 'kW' : ''} ${m.poles ? m.poles + '극' : ''}`.trim(), summary: [m.V && m.V + 'V', m.I && trimNum(m.I, 3) + 'A', m.T && trimNum(m.T, 3) + 'N·m'].filter(Boolean).join(' · '),
      html: `${sel}${big ? `<div class="tiny" style="margin-top:8px">정격 출력</div><div class="res-big">${big}${m.T && m.P ? `<small>${trimNum(m.T, 3)} N·m</small>` : ''}</div>` : ''}${rowsHTML(m.rows)}${notesHTML(m.warn, 'warn')}${notesHTML(m.notes)}`,
    };
  },
  breaker(i) {
    const b = breakerCalc(i);
    if (!num(i.in)) return { html: `<div class="muted small">정격 전류(AT)를 넣으면 곡선별 차단 전류와 걸 수 있는 부하를 계산해요.</div>${rowsHTML(b.rows)}` };
    return {
      title: `차단기 ${i.poles}P ${i.curve || ''}${i.in}A`, summary: [BREAKER_KIND[i.kind] && i.kind, i.ka && i.ka + 'kA', i.ma && i.ma + 'mA'].filter(Boolean).join(' · '),
      html: `<div class="tiny">정격 전류</div><div class="res-big">${i.curve ? esc(i.curve) : ''}${esc(i.in)} A<small>${i.poles}P</small></div>${rowsHTML(b.rows)}${notesHTML(b.notes)}`,
    };
  },
  wire(i) {
    const A = +i.sq, R = WIRE_R[A];
    const rows = [['종류', `${i.kind}: ${WIRE_TYPES[i.kind] || ''}`], ['단면적', `${A} mm² (sq)`]];

/* ============ 대체품 (① 대체 기준 ② 제조사 검색 ③ AI 추천) ============ */
// 국내 제조사 (부품별). 검색은 Google에 "제조사 + 사양"으로 보내서 주소가 바뀌어도 동작하게 한다

  inductor:  ['삼성전기'],
  motor:     ['HD현대일렉트릭', '효성중공업', '하이젠모터'],
  breaker:   ['LS ELECTRIC', 'HD현대일렉트릭', '상도전기', '서전기전'],
  wire:      ['LS전선', '대한전선', '가온전선', '일진전기'],

/* 지금 입력값에서 사양 요약·대체 조건·검색어를 만든다 */
function altInfo(i) {

    if (i.mode === 'color') { const d = decodeBands(i.bands); if (d.ok) ({ ohm, tol, tc } = d); }
    else if (i.mode === 'smd') { const d = decodeSMD(i.smd); if (d.ok) { ohm = d.ohm; tol = d.tol; smd = true; } }
    else { ohm = parseOhm(i.val); }
    if (ohm == null) return null;
    spec = `저항 ${fmtSI(ohm, 'Ω')}${tol ? ' ±' + tol + '%' : ''}${smd ? ' SMD 칩 저항' : ''}`;
    q = `${smd ? '칩 저항' : '저항'} ${fmtSI(ohm, 'Ω').replace(' ', '')}${tol ? ' ' + tol + '%' : ''}`;
    crit.push(['저항값', `${fmtSI(ohm, 'Ω')} 같게`]);
    if (tol) crit.push(['오차', `±${tol}% 같거나 더 작게`]);
    crit.push(['정격 전력', smd ? '칩 크기(0603·1206 등) 같게 → 전력도 같아짐' : '같거나 크게 (몸통 길이 약 6mm면 보통 1/4W)']);
    if (tc) crit.push(['온도 계수', `${tc} ppm/°C 같거나 더 작게`]);
    crit.push(['종류', '탄소 피막·금속 피막 등 같은 종류 (정밀 회로는 금속 피막)']);
  } else if (P === 'capacitor') {
    const r = parseCap(i.text); if (r.pF == null) return null;
    const v = fmtSI(r.pF * 1e-12, 'F');
    const elec = r.pF >= 1e6 && !r.die && r.vType !== 'AC';
    spec = `콘덴서 ${v}${r.volt ? ' ' + trimNum(r.volt) + 'V' + (r.vType || '') : ''}${r.tol ? ' ' + r.tol : ''}${r.die ? ' ' + r.die.name : ''}${r.vType === 'AC' ? ' 모터 운전용(AC)' : elec ? ' 전해' : ''}`;
    q = `${r.vType === 'AC' ? '모터 콘덴서' : elec ? '전해 콘덴서' : '콘덴서'} ${v.replace(' ', '')}${r.volt ? ' ' + trimNum(r.volt) + 'V' : ''}`;
    crit.push(['용량', `${v} 같게`]);
    crit.push(['내압', r.volt ? `${trimNum(r.volt)}V${r.vType ? ' ' + r.vType : ''} 같거나 높게` : '원래 부품 이상 (표기 확인)']);
    if (r.tol) crit.push(['오차', `${r.tol} 같거나 더 작게`]);
    if (r.die) crit.push(['유전체', `${r.die.name} 같거나 더 안정한 것 (C0G > X7R > X5R > Y5V)`]);

    q = `${i.phase === 1 ? '단상' : '3상'} 유도전동기${m.P ? ' ' + trimNum(m.P) + 'kW' : ''}${m.poles ? ' ' + m.poles + 'P' : ''}`;
    if (m.P) crit.push(['출력', `${trimNum(m.P)} kW 같게`]);
    if (m.poles) crit.push(['극수', `${m.poles}극 같게 (회전수가 같아짐)`]);
    crit.push(['전압·주파수·결선', `${m.volts.length ? m.volts.join('/') + 'V' : '같은 전압'}, ${num(i.freq) || 60}Hz${i.conn ? ', ' + i.conn : ''} 같게`]);

    crit.push(['효율 등급', '같거나 높게 (IE2 → IE3 등)']);
    if (i.ins) crit.push(['절연 등급', `${i.ins}종 같거나 높게`]);
    if (i.ip) crit.push(['보호 등급', `${i.ip} 같거나 높게`]);

    if (!num(i.in)) return null;
    spec = `${KIND_KO[i.kind] || '차단기'} ${i.poles}P ${i.curve || ''}${i.in}A${i.af ? ' ' + i.af + 'AF' : ''}${i.ka ? ' ' + i.ka + 'kA' : ''}${i.ma && i.kind === 'ELB' ? ' ' + i.ma + 'mA' : ''}${i.v ? ' ' + i.v + 'V' : ''}`;
    q = `${KIND_KO[i.kind] || '차단기'} ${i.poles}P ${i.curve || ''}${i.in}A${i.ma && i.kind === 'ELB' ? ' ' + i.ma + 'mA' : ''}`;
    crit.push(['종류', `${KIND_KO[i.kind] || '차단기'} 같게`]);
    crit.push(['극수', `${i.poles}P 같게`]);
    crit.push(['정격 전류', `${i.in} A 같게`]);
    if (i.curve) crit.push(['트립 곡선', `${i.curve} 같게`]);
    crit.push(['차단 용량', i.ka ? `${i.ka} kA 같거나 크게` : '원래 제품 이상']);

    q = `${i.kind} ${i.sq}SQ${i.cores ? ' ' + i.cores + 'C' : ''}`;
    crit.push(['굵기', `${i.sq} sq 같거나 굵게`]);
    crit.push(['종류', `${i.kind} 같은 규격 (난연·저독성 등급 같거나 상위)`]);

async function findAlternatives() {

  } catch (e) {

function loadImage(file) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { ok(img); URL.revokeObjectURL(url); };
    img.onerror = () => no(new Error('사진을 열 수 없어요'));
    img.src = url;
  });
}
function shrink(img, max, q) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

  const big = shrink(img, 1280, 0.85), thumb = shrink(img, 200, 0.6);
  if (!settings.aiUrl) { showDemoSheet(thumb); return; }
  showSheet(`<div class="loading"><img src="${big}" alt=""><div class="spin"></div><b>사진을 읽고 있어요…</b><div class="tiny">보통 5~15초 걸려요</div></div>`);
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 60000);
  try {
    const res = await fetch(settings.aiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctl.signal,
      body: JSON.stringify({ image: big.split(',')[1], mime: 'image/jpeg', hint: scanHint }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.ok) throw new Error(j.error || `서버 오류 (${res.status})`);
    closeSheet(); applyAI(j.result, thumb);
  } catch (e) {
    showSheet(`<h3>분석하지 못했어요</h3><div class="note warn">${esc(e.name === 'AbortError' ? '시간이 너무 오래 걸렸어요. 다시 시도해 주세요' : e.message)}</div>
      <div class="small muted" style="margin-top:10px">조금 더 가까이, 밝은 곳에서, 글자가 흔들리지 않게 찍으면 잘 읽혀요.</div>
      <div class="btnrow"><button class="btn" data-act="closeSheet">닫기</button></div>`);
  } finally { clearTimeout(tm); }
}

/* AI가 돌려준 JSON → 부품 화면 입력값으로 옮기기 (계산은 calc.js가 한다) */
function applyAI(r, thumb) {
  if (!r || typeof r !== 'object') { toast('결과를 이해하지 못했어요'); return; }
  const scan = { thumb, raw: r.raw_text || '', note: r.note || '', conf: typeof r.confidence === 'number' ? r.confidence : null };
  const t = r.type;
  const mk = { maker: r.maker || r.motor?.maker || r.breaker?.maker || '', model: r.model || r.motor?.model || r.breaker?.model || '' };
  const open = (id, input, sc) => openPart(id, Object.assign({}, mk, input), sc);   // 제조사·모델명도 같이 넘김
  if (t === 'resistor_color' && Array.isArray(r.bands) && r.bands.length >= 3) {
    const o = autoOrient(r.bands.slice(0, 6));
    scan.flipped = o.flipped;
    open('resistor', { mode: 'color', n: Math.max(4, o.bands.length), bands: o.bands.length === 3 ? [...o.bands, 'none'] : o.bands }, scan);
  } else if (t === 'resistor_smd') {
    open('resistor', { mode: 'smd', smd: String(r.marking || '').replace(/\s/g, '') }, scan);
  } else if (t === 'capacitor') {
    open('capacitor', { text: r.marking || '' }, scan);
  } else if (t === 'inductor') {
    if (Array.isArray(r.bands) && r.bands.length >= 4) open('inductor', { mode: 'color', n: 4, bands: autoOrient(r.bands.slice(0, 4)).bands }, scan);
    else open('inductor', { mode: 'code', text: r.marking || '' }, scan);
  } else if (t === 'motor') {
    const m = r.motor || {};
    const s = v => v == null ? '' : String(v);
    open('motor', { phase: m.phase == 1 ? 1 : 3, voltage: s(m.voltage), current: s(m.current), kw: s(m.power_kw), hp: s(m.power_hp), freq: m.freq || settings.freq, poles: s(m.poles), rpm: s(m.rpm), eff: s(m.efficiency), pf: s(m.power_factor), ins: s(m.insulation), ip: s(m.ip), duty: s(m.duty), sf: s(m.sf), conn: s(m.connection) }, scan);
  } else if (t === 'breaker') {
    const b = r.breaker || {};
    const kind = ['MCB', 'MCCB', 'ELB'].includes(b.kind) ? b.kind : 'MCCB';
    open('breaker', { kind, poles: [1, 2, 3, 4].includes(+b.poles) ? +b.poles : 3, in: b.rated_current ?? '', af: b.frame ?? '', curve: ['B', 'C', 'D'].includes(b.curve) ? b.curve : '', ka: b.breaking_ka ?? '', ma: b.sensitivity_ma ?? '', v: b.voltage ?? '' }, scan);
  } else if (t === 'wire') {
    const w = parseWire(r.marking || '');
    open('wire', { text: r.marking || '', kind: w.kind || 'HFIX', sq: WIRE_SIZES.includes(w.sq) ? w.sq : 2.5, cores: w.cores || '' }, scan);
  } else {
    showSheet(`<h3>어떤 부품인지 알아보지 못했어요</h3>${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}
      ${r.raw_text ? `<div class="sec-title" style="margin:12px 0 6px">읽은 글자</div><div class="mono">${esc(r.raw_text)}</div>` : ''}
      <div class="small muted" style="margin-top:10px">홈에서 부품 종류를 골라 다시 찍거나, 직접 입력해 보세요.</div>
      <div class="btnrow"><button class="btn" data-act="closeSheet">닫기</button></div>`);
    return;
  }
  setTimeout(() => saveHistory(true), 50);
}

/* AI 서버 없이 흐름을 체험하는 예시 (실제로 AI가 돌려주는 모양과 같다) */
const DEMOS = {
  resistor: { label: '저항 색띠 (반대로 찍힌 사진)', r: { type: 'resistor_color', confidence: 0.86, bands: ['gold', 'red', 'violet', 'yellow'], raw_text: '', note: '띠 4개가 보여요. 금색 띠가 한쪽 끝에 있어요.' } },
  capacitor: { label: '필름 콘덴서 2A473J', r: { type: 'capacitor', confidence: 0.93, marking: '2A473J', raw_text: '2A473J', note: '' } },
  motor: { label: '3상 유도 전동기 명판', r: { type: 'motor', confidence: 0.9, maker: '예시모터', model: 'EXM-75', motor: { phase: 3, voltage: '220/380', current: '26.4/15.2', power_kw: 7.5, freq: 60, poles: 4, rpm: 1755, efficiency: 89.5, insulation: 'F', ip: 'IP55', duty: 'S1', connection: 'Δ/Y' }, raw_text: '3 PHASE INDUCTION MOTOR\n7.5kW 4P 60Hz\n220/380V 26.4/15.2A\n1755 r/min  EFF 89.5%\nINS. F  IP55  S1  Δ/Y', note: '' } },
  breaker: { label: '누전 차단기 2P 30A 30mA', r: { type: 'breaker', confidence: 0.88, maker: '예시전기', model: 'EX-230', breaker: { kind: 'ELB', poles: 2, rated_current: 30, frame: 50, breaking_ka: 2.5, sensitivity_ma: 30, voltage: 220 }, raw_text: '2P 50AF 30AT\n220V 2.5kA\nIΔn 30mA 0.03s', note: '' } },
  wire: { label: '케이블 F-CV 4C 6sq', r: { type: 'wire', confidence: 0.91, marking: 'F-CV 0.6/1kV 4C × 6SQ', raw_text: 'F-CV 0.6/1kV 4C X 6SQ 2026', note: '' } },
};
function showDemoSheet(thumb) {
  showSheet(`<h3>예시로 체험하기</h3><div class="small muted">AI 서버를 연결하기 전에, AI가 돌려주는 결과와 같은 모양의 예시 데이터로 흐름을 볼 수 있어요.</div>
    <div style="margin-top:12px">${Object.entries(DEMOS).map(([k, d]) => `<button class="hist" data-demo="${k}"><div class="th">${IC[k]}</div><div class="tx"><b>${d.label}</b><span>예시 결과 보기</span></div></button>`).join('')}</div>`);
  showDemoSheet.thumb = thumb || null;
}

/* ============ 이벤트 (문서 하나에 위임) ============ */
document.addEventListener('click', async e => {
  const el = e.target.closest('button, a'); if (!el) return;
  const d = el.dataset;
  if (d.go) { if (d.new) cur = null; location.hash = d.go; return; }
  if (d.hint) { scanHint = d.v; renderHome(); return; }
  if (d.set) { cur.input[d.set] = isNaN(+d.v) || d.v === '' ? d.v : +d.v; renderPart(); return; }
  if (d.bandn) { setBandCount(cur.input, +d.v); renderPart(); return; }
  if (d.band != null) { cur.input.bands[+d.band] = d.v; renderPart(); return; }
  if (d.fill) { cur.input[d.fill] = d.v; renderPart(); return; }
  if (d.sel) { cur.input.sel = +d.v; renderResult(); return; }
  if (d.sfreq) { settings.freq = +d.v; LS.set('settings', settings); renderSettings(); return; }
  if (d.theme) { if (d.v === 'dark') document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme; LS.set('theme', d.v); document.querySelector('meta[name=theme-color]').content = d.v === 'dark' ? '#15142A' : '#F4F5F9'; renderSettings(); return; }
  if (d.open) { const h = history.find(x => x.id === d.open); if (h) openPart(h.part, h.input, h.thumb || h.scan ? Object.assign({ thumb: h.thumb }, h.scan || {}) : null); return; }
  if (d.del) { history = history.filter(x => x.id !== d.del); LS.set('history', history); route(); return; }
  if (d.demo) { closeSheet(); applyAI(DEMOS[d.demo].r, showDemoSheet.thumb); return; }
  switch (d.act) {
    case 'cam': $('#fileCam').click(); break;
    case 'lib': $('#fileLib').click(); break;
    case 'demo': showDemoSheet(null); break;
    case 'closeSheet': closeSheet(); break;
    case 'save': saveHistory(false); break;
    case 'altAI': findAlternatives(); break;
    case 'flip': cur.input.bands = cur.input.bands.slice().reverse(); if (cur.scan) cur.scan.flipped = false; renderPart(); break;
    case 'saveUrl': {
      const v = ($('[data-k=aiUrl]').value || '').trim();
      if (v && !/^https:\/\//.test(v)) { toast('https:// 로 시작하는 주소를 넣어 주세요'); break; }
      settings.aiUrl = v; LS.set('settings', settings); toast(v ? '저장했어요' : 'AI 서버 연결을 해제했어요'); break;
    }
    case 'testUrl': {
      const v = ($('[data-k=aiUrl]').value || '').trim(); if (!v) { toast('주소를 먼저 넣어 주세요'); break; }
      try { const r = await fetch(v); const j = await r.json(); toast(j.ok ? `연결됐어요 (모델: ${j.model || '?'})` : '응답이 이상해요'); }
      catch (err) { toast('연결하지 못했어요. 주소와 Worker 설정을 확인해 주세요'); }
      break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify({ app: 'part-spec', v: 1, history, settings }, null, 1)], { type: 'application/json' });
      const name = `부품사양_백업_${new Date().toISOString().slice(0, 10)}.json`;
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); } catch (err) {} }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
      break;
    }
    case 'import': $('#fileBackup').click(); break;
    case 'clear': if (confirm('기록을 모두 지울까요?')) { history = []; LS.set('history', history); toast('지웠어요'); } break;
  }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.k; if (!k || !cur || k === 'aiUrl') return;
  cur.input[k] = e.target.value;
  if (k === 'voltage') cur.input.sel = null;
  if (cur.alt && !cur.alt.loading && k !== 'maker' && k !== 'model') { cur.alt = null; const b = $('#altAI'); if (b) b.innerHTML = ''; }
  renderResult();   // 폼은 다시 그리지 않는다 (입력 중인 커서가 사라지지 않게)
});
document.addEventListener('change', e => {
  if (e.target.dataset.k === 'text' && cur?.part === 'wire') {   // 전선 표기 → 종류·굵기 자동 채우기
    const w = parseWire(e.target.value);
    if (w.kind) cur.input.kind = w.kind;
    if (w.sq && WIRE_SIZES.includes(w.sq)) cur.input.sq = w.sq;
    if (w.cores) cur.input.cores = w.cores;
    renderPart();
  }
});
['fileCam', 'fileLib'].forEach(id => $('#' + id).addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) analyzeFile(f); }));
$('#fileBackup').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'part-spec' || !Array.isArray(j.history)) throw 0;
    const ids = new Set(history.map(h => h.id));
    history = [...history, ...j.history.filter(h => !ids.has(h.id))].sort((a, b) => b.t - a.t).slice(0, MAX_HISTORY);
    LS.set('history', history); toast('불러왔어요');
  } catch (err) { toast('이 앱의 백업 파일이 아니에요'); }
});

route();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
